<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vị trí hàng · TOKOSI Dashboard</title>
  <link rel="icon" type="image/jpeg" href="/Logo.jpg">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('tks-dashboard-theme') === 'light' ? 'light' : 'dark'; }
    catch (error) { document.documentElement.dataset.theme = 'dark'; }
    document.documentElement.style.visibility = 'hidden';
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/shared/shared.css?v=20261006">
  <link rel="stylesheet" href="/stock-locations/stock-locations.css?v=20261003-3">
</head>
<body>
  <div class="receipt-header">
    <div class="brand">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Mở menu điều hướng" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <div class="brand-mark"><img src="/Logo.jpg" alt="TOKOSI Logo" width="44" height="44"></div>
      <div class="brand-text"><h1>Tổng kho gia dụng Tokosi</h1></div>
    </div>
    <div class="status-line">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Chuyển chế độ giao diện">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"></path></svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        <span id="themeLabel">Light mode</span>
      </button>
      <div class="account-chip" id="accountChip"></div>
    </div>
  </div>
  <div class="shell">
    <div class="backdrop" id="backdrop"></div>
    <div class="sidebar" id="sidebar" data-tks-active-top="stockLocations"></div>
    <main class="content">
      <h2 class="locations-title">Vị trí hàng</h2>
      <nav class="locations-tabs" aria-label="Cơ sở tra cứu vị trí hàng">
        <a href="#hn" data-location-tab="hn">Vị trí HN</a>
        <a href="#sg" data-location-tab="sg">Vị trí SG</a>
      </nav>
      <section class="locations-panel" aria-labelledby="locationTableTitle">
        <div class="locations-toolbar">
          <h3 id="locationTableTitle">Vị trí HN</h3>
          <label class="locations-search">
            <span class="locations-sr-only">Tìm theo mã hàng, tên hàng hoặc vị trí</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
            <input id="locationSearch" type="search" placeholder="Tìm mã, tên hàng hoặc vị trí…" autocomplete="off">
          </label>
          <button class="locations-columns-button" id="locationColumnsButton" type="button" aria-haspopup="dialog" aria-controls="locationColumnsDialog" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16M15 4v16"></path></svg>
            Cột hiển thị
          </button>
        </div>
        <p id="locationStatus" class="locations-status" role="status" aria-live="polite"></p>
        <div class="locations-scroll" tabindex="0" aria-label="Bảng vị trí hàng">
          <table class="locations-table" aria-labelledby="locationTableTitle" id="locationTable">
            <colgroup><col class="locations-code"><col class="locations-name"><col class="locations-quantity"><col class="locations-notes"><col><col class="locations-position"></colgroup>
            <thead><tr><th scope="col">Mã hàng</th><th scope="col">Tên hàng</th><th scope="col">Tổng SL</th><th scope="col">Ghi chú hàng hóa</th><th scope="col">Ngày về</th><th scope="col">Vị trí</th></tr></thead>
            <tbody id="locationRows"></tbody>
          </table>
        </div>
        <div class="locations-pager" id="locationPager" hidden>
          <span id="locationCount"></span>
          <div class="locations-pager-controls">
            <button id="locationFirst" type="button" aria-label="Trang đầu" title="Trang đầu">&lt;&lt;</button>
            <button id="locationPrevious" type="button" aria-label="Trang trước" title="Trang trước">&lt;</button>
            <span id="locationPage"></span>
            <button id="locationNext" type="button" aria-label="Trang sau" title="Trang sau">&gt;</button>
            <button id="locationLast" type="button" aria-label="Trang cuối" title="Trang cuối">&gt;&gt;</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <dialog id="locationColumnsDialog" class="locations-columns-dialog" aria-labelledby="locationColumnsTitle">
    <div class="locations-columns-header">
      <h3 id="locationColumnsTitle">Cột hiển thị</h3>
      <button id="locationColumnsClose" type="button" aria-label="Đóng chọn cột">✕</button>
    </div>
    <p>Chọn cột cần xem. Lựa chọn được nhớ riêng cho điện thoại và máy tính trên trình duyệt này.</p>
    <div id="locationColumnsList"></div>
    <div class="locations-columns-actions">
      <button id="locationColumnsAll" type="button">Hiện tất cả</button>
      <button id="locationColumnsReset" type="button">Về mặc định</button>
    </div>
  </dialog>
  <script src="/shared/shared-nav.js?v=20261005"></script>
  <script src="/stock-locations/stock-locations.js?v=20261003-3"></script>
  <script>window.addEventListener('DOMContentLoaded', function () { TKSStockLocations.init(); });</script>
  <script src="/shared/shooting-star.js?v=20260830"></script>
</body>
</html>
