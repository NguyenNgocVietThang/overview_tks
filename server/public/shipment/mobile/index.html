<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Giao hàng Mobile · TOKOSI</title>
<link rel="icon" type="image/jpeg" href="/Logo.jpg">
<meta name="description" content="Trang tác nghiệp di động cho Thủ kho và Lái xe — cập nhật trạng thái đơn vận chuyển 1-chạm.">
<meta name="theme-color" content="#090D16">
<script>
  (function(){
    try{ document.documentElement.dataset.theme = localStorage.getItem('tks-dashboard-theme') === 'light' ? 'light' : 'dark'; }
    catch(e){ document.documentElement.dataset.theme = 'dark'; }
    document.documentElement.style.visibility = 'hidden';
  })();
</script>
<link rel="stylesheet" href="/shared/shared.css">
<script src="/shared/shared-nav.js"></script>
<script src="/shared/image-compress.js"></script>
<script src="/shared/three-interactions.js"></script>
<script src="/shared/three-loading.js"></script>
<style>
/* ===== MOBILE-FIRST layout ===== */
*{ -webkit-tap-highlight-color: transparent; }

body{
  padding-bottom: 80px; /* cho bottom nav */
}

/* ---- Top bar ---- */
.mob-topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 12px;background:var(--panel);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
}
.mob-brand{display:flex;align-items:center;gap:10px;}
.mob-brand-icon{
  width:36px;height:36px;border-radius:10px;
  background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:var(--primary-shadow);flex-shrink:0;
}
.mob-brand h1{margin:0;font-family:var(--font-display);font-size:16px;font-weight:800;letter-spacing:-.01em;}
.mob-brand .sub{margin:1px 0 0;font-size:11px;color:var(--muted);}
/* Thu gon #accountChip (server/public/shared/shared.css) cho topbar mobile hep */
#accountChip{ gap:6px; }
#accountChip .profile-trigger{ min-height:34px; padding:0 8px 0 4px; }
#accountChip .profile-trigger .who .role{ display:none; }
#accountChip .logout-btn-standalone{ min-height:34px; padding:0 8px; font-size:11px; }

/* ---- Content ---- */
.mob-content{padding:14px 14px 0;}
.mob-section-title{
  font-family:var(--font-display);font-size:14px;font-weight:700;
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;
  margin:0 0 10px;
}

/* ---- Order cards ---- */
.order-list{display:flex;flex-direction:column;gap:10px;}
.order-card{
  background:var(--panel);border:1px solid;border-radius:16px;padding:14px 16px;
  box-shadow:var(--card-shadow);
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
.card-code{font-family:var(--font-data);font-size:14px;font-weight:700;color:var(--text);}
.card-customer{font-size:13.5px;color:var(--text-secondary);margin-top:2px;}
.status-dot{
  display:inline-flex;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;
  border:1px solid;white-space:nowrap;flex-shrink:0;
}
.card-address{font-size:13px;color:var(--muted);margin-bottom:4px;line-height:1.45;}
.card-phone{font-size:13px;color:var(--text-secondary);margin-bottom:10px;}
.card-actions{display:flex;flex-direction:column;gap:8px;}

/* ---- Action buttons ---- */
.btn-photo{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;border-radius:14px;font-family:var(--font-display);font-size:15px;font-weight:700;
  background:var(--panel-2);border:2px dashed var(--border);color:var(--text-secondary);
  cursor:pointer;transition:border-color .15s,background .15s,color .15s;padding:0 16px;
  text-align:center;
}
.btn-photo:active{background:var(--panel-3);}
.btn-photo:hover{border-color:var(--blue);color:var(--blue);}
.btn-photo-secondary{
  border-color:rgba(245,158,11,.4);color:var(--amber);background:rgba(245,158,11,.06);
}
.btn-photo-secondary:hover{border-color:var(--amber);color:var(--amber);}

.btn-confirm{
  min-height:52px;border-radius:14px;font-family:var(--font-display);font-size:15px;font-weight:800;
  background:var(--primary-gradient);color:#fff;border:none;
  box-shadow:var(--primary-shadow);cursor:pointer;
  transition:opacity .15s,transform .1s;padding:0 16px;
}
.btn-confirm:active{opacity:.85;transform:scale(.98);}
.btn-confirm:disabled{opacity:.45;cursor:not-allowed;transform:none;}

.btn-danger{
  min-height:48px;border-radius:14px;font-family:var(--font-display);font-size:14px;font-weight:700;
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:var(--red);
  cursor:pointer;transition:background .15s,border-color .15s;padding:0 16px;
}
.btn-danger:active{background:rgba(239,68,68,.2);}

/* ---- Exception overlay ---- */
.exc-overlay{
  position:fixed;inset:0;background:var(--veil);z-index:100;
  display:flex;align-items:flex-end;backdrop-filter:blur(4px);
}
.exc-dialog{
  background:var(--panel);border-top:1px solid var(--border);border-radius:24px 24px 0 0;
  padding:20px 18px 34px;width:100%;box-shadow:0 -16px 48px rgba(0,0,0,.4);
}
.exc-dialog-title{font-family:var(--font-display);font-size:17px;font-weight:800;margin:0 0 14px;}
.exc-form{display:flex;flex-direction:column;gap:10px;}
.exc-form select,.exc-form textarea{
  padding:12px 14px;background:var(--panel-2);color:var(--text);
  border:1px solid var(--border);border-radius:12px;
  font-family:var(--font-body);font-size:14px;width:100%;
  transition:border-color .15s;
}
.exc-form select:focus,.exc-form textarea:focus{outline:none;border-color:var(--blue);}
.exc-form textarea{min-height:90px;resize:none;}
.exc-actions{display:flex;gap:10px;}
.exc-actions .btn-cancel{
  flex:1;min-height:48px;border-radius:12px;background:var(--panel-2);
  border:1px solid var(--border);color:var(--text);font-family:var(--font-display);font-size:14px;font-weight:700;
  cursor:pointer;
}
.exc-actions .btn-send{
  flex:2;min-height:48px;border-radius:12px;
  background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.35);
  color:var(--red);font-family:var(--font-display);font-size:14px;font-weight:800;cursor:pointer;
  transition:background .15s;
}
.exc-actions .btn-send:active{background:rgba(239,68,68,.25);}

/* ---- Status bar ---- */
.status-bar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  padding:12px 16px;font-size:13.5px;font-weight:600;text-align:center;
  transform:translateY(-100%);transition:transform .25s var(--ease-out);
  pointer-events:none;
}
.status-bar.show{transform:translateY(0);}
.status-bar.status-ok{background:rgba(16,185,129,.9);color:#fff;}
.status-bar.status-error{background:rgba(239,68,68,.9);color:#fff;}
.status-bar.status-info{background:var(--panel-3);color:var(--text);}

/* ---- Bottom nav ---- */
.mob-bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--panel);border-top:1px solid var(--border);
  display:flex;height:64px;
  backdrop-filter:blur(10px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.mob-nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;
  transition:color .15s;
}
.mob-nav-item.active{color:var(--blue);}
.mob-nav-item svg{width:22px;height:22px;}

/* ---- Refresh btn ---- */
.btn-refresh{
  display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;border-radius:12px;background:var(--panel-2);
  border:1px solid var(--border);color:var(--text);font-family:var(--font-display);font-size:13.5px;font-weight:700;
  cursor:pointer;margin-bottom:14px;width:100%;
  transition:background .15s,border-color .15s;
}
.btn-refresh:active{background:var(--panel-3);}

/* ---- Theme ---- */
.theme-icon-moon{display:none;}
:root[data-theme="light"] .theme-icon-sun{display:none;}
:root[data-theme="light"] .theme-icon-moon{display:block;}
</style>
</head>
<body>

<!-- ======================== TOP BAR ======================== -->
<header class="mob-topbar">
  <div class="mob-brand">
    <div class="brand-mark" style="width:38px;height:38px;border-radius:10px;padding:2px;">
      <img src="/Logo.jpg" alt="TOKOSI Logo" width="38" height="38">
    </div>
    <div>
      <h1>TOKOSI Mobile</h1>
      <p class="sub">Tác nghiệp vận chuyển</p>
    </div>
  </div>
  <div id="accountChip"></div>
</header>

<!-- ======================== MAIN CONTENT ======================== -->
<main class="mob-content perspective-container">

  <button class="btn-refresh" id="btnRefresh" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:5px;"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>Làm mới danh sách
  </button>

  <p class="mob-section-title" id="listTitle">Đơn hàng cần xử lý</p>

  <div class="order-list perspective-container" id="orderList">
    <div style="color:var(--muted);font-size:14px;text-align:center;padding:30px;">Đang tải...</div>
  </div>

  <div class="empty-state" id="emptyState" hidden>
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:40px;height:40px;color:var(--muted);"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
    </div>
    <h3>Không có đơn nào</h3>
    <p>Hiện tại không có đơn hàng cần xử lý.</p>
  </div>

</main>

<!-- ======================== EXCEPTION OVERLAY ======================== -->
<div class="exc-overlay" id="excOverlay" hidden>
  <div class="exc-dialog" id="excDialog" hidden role="dialog" aria-modal="true" aria-labelledby="excDialogTitle">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <h3 class="exc-dialog-title" id="excDialogTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;display:inline-block;vertical-align:-2px;margin-right:6px;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>Báo sự cố</h3>
      <button style="background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;" id="btnCloseExc" aria-label="Đóng">✕</button>
    </div>
    <form class="exc-form" id="excForm">
      <select id="excType" required aria-label="Loại sự cố">
        <option value="">— Chọn loại sự cố —</option>
        <option value="MISSING_ITEM">Thiếu hàng</option>
        <option value="DAMAGED_ITEM">Hàng hỏng</option>
        <option value="WRONG_ADDRESS">Sai địa chỉ</option>
        <option value="CUSTOMER_REFUSE">Khách từ chối nhận</option>
        <option value="VEHICLE_BREAKDOWN">Xe hỏng</option>
        <option value="OTHER">Khác</option>
      </select>
      <textarea id="excDescription" placeholder="Mô tả chi tiết sự cố..." required></textarea>
      <div class="exc-actions">
        <button class="btn-cancel" type="button" id="btnCancelExc">Hủy</button>
        <button class="btn-send" type="submit">Gửi báo cáo</button>
      </div>
    </form>
  </div>
</div>

<!-- ======================== STATUS BAR ======================== -->
<div class="status-bar" id="statusBar" role="status" aria-live="polite"></div>

<!-- ======================== BOTTOM NAV ======================== -->
<nav class="mob-bottom-nav" aria-label="Điều hướng chính">
  <a href="/shipment/mobile/" class="mob-nav-item active" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/>
      <path d="M15 18H9"/>
      <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/>
      <circle cx="17" cy="18" r="2"/>
      <circle cx="7" cy="18" r="2"/>
    </svg>
    Giao hàng
  </a>
  <a href="/shipment/" class="mob-nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
    Tra cứu
  </a>
  <a href="/shipment/dispatch/" class="mob-nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M8 7v7"></path><path d="M12 7v4"></path><path d="M16 7v9"></path>
    </svg>
    Điều phối
  </a>
</nav>

<script>
  const refreshSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:5px;"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>';
  document.getElementById('btnRefresh').addEventListener('click', async function(){
    this.disabled = true;
    this.textContent = 'Đang tải...';
    try {
      await loadOrders();
      renderOrders();
      showStatus('Đã làm mới.', 'ok');
    } catch(e) {
      showStatus('Lỗi: ' + e.message, 'error');
    }
    this.disabled = false;
    this.innerHTML = refreshSvg + 'Làm mới danh sách';
  });

  document.getElementById('btnCancelExc').addEventListener('click', closeExceptionDialog);

  /* Theme toggle via query (optional) */
  const THEME_KEY = 'tks-dashboard-theme';
  function toggleTheme(){
    const n = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = n;
    try{ localStorage.setItem(THEME_KEY, n); } catch(e){}
  }
</script>
<script src="/shipment/mobile/mobile.js"></script>
<!-- 3D Background Particle System (auto-reduced to 100 particles on mobile) -->
<script src="/vendor/three.min.js"></script>
<script src="/shared/three-performance.js"></script>
<script src="/shared/three-memory.js"></script>
<script src="/shared/three-visibility.js"></script>
<script src="/shared/three-bg.js"></script>
</body>
</html>
